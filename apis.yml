description: 'Evelo Biosciences was a Flagship Pioneering-founded, GV-backed microbiome
  biotechnology company in Cambridge, Massachusetts, developing orally delivered
  investigational medicines acting on the small intestinal axis. Following clinical
  failures of its lead candidates EDP1815 and EDP2939, the company announced
  dissolution in November 2023 and has been wound down. It is retained in the API
  Evangelist network as a dissolved life-sciences portfolio record: the evelobio.com
  domain now serves only a parked catch-all error page and the company publishes no
  developer portal, documentation, or API surface of any kind.'
